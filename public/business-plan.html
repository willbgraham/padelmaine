document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2fb7fe98-ec76-4eee-96c1-6a962b448ca3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\nhtml, body { background: #1a1a1a; margin: 0; padding: 0; }\nbody { font-family: 'DM Sans', sans-serif; }\n\ndeck-stage { --slide-bg: var(--paper); }\n\nsection {\n  width: 1920px;\n  height: 1080px;\n  background: var(--paper);\n  color: var(--ink);\n  font-family: 'DM Sans', sans-serif;\n  position: relative;\n  overflow: hidden;\n  box-sizing: border-box;\n}\n\n/* Slide chrome — corner stamps like a drawing sheet */\n.sheet-stamp {\n  position: absolute;\n  font-family: 'IBM Plex Mono', monospace;\n  font-size: 13px;\n  letter-spacing: 0.08em;\n  color: var(--ink-3);\n  text-transform: uppercase;\n}\n.sheet-stamp.tl { top: 32px; left: 48px; }\n.sheet-stamp.tr { top: 32px; right: 48px; text-align: right; }\n.sheet-stamp.bl { bottom: 32px; left: 48px; }\n.sheet-stamp.br { bottom: 32px; right: 48px; text-align: right; }\n\n.sheet-stamp .sk { color: var(--ink); font-weight: 600; }\n.sheet-stamp .lbl { color: var(--ink-4); display: block; font-size: 10px; margin-bottom: 2px; }\n\n/* Crosshair corner marks */\n.crosshair {\n  position: absolute;\n  width: 18px; height: 18px;\n  pointer-events: none;\n}\n.crosshair::before, .crosshair::after {\n  content: '';\n  position: absolute;\n  background: var(--ink);\n}\n.crosshair::before { top: 50%; left: 0; right: 0; height: 1px; transform: translateY(-0.5px); }\n.crosshair::after { left: 50%; top: 0; bottom: 0; width: 1px; transform: translateX(-0.5px); }\n.crosshair.tl { top: 16px; left: 16px; }\n.crosshair.tr { top: 16px; right: 16px; }\n.crosshair.bl { bottom: 16px; left: 16px; }\n.crosshair.br { bottom: 16px; right: 16px; }\n\n/* Type scales */\n.h-display { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.02em; line-height: 0.95; }\n.h-section { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.01em; line-height: 1.05; }\n.h-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); }\n.body-lg { font-family: 'DM Sans', sans-serif; font-size: 22px; line-height: 1.45; color: var(--ink-2); }\n.body { font-family: 'DM Sans', sans-serif; font-size: 18px; line-height: 1.5; color: var(--ink-2); }\n.body-sm { font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; color: var(--ink-3); }\n.mono { font-family: 'IBM Plex Mono', monospace; }\n.mono-sm { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.04em; }\n\n/* Hairline rules */\n.rule { border-top: 1px solid var(--rule); }\n.rule-light { border-top: 1px solid var(--rule-light); }\n\n/* Legend swatch */\n.swatch { width: 16px; height: 16px; border: 1px solid var(--ink); display: inline-block; vertical-align: middle; }\n\n/* Tag chip */\n.chip {\n  display: inline-flex; align-items: center; gap: 8px;\n  font-family: 'IBM Plex Mono', monospace; font-size: 12px;\n  letter-spacing: 0.08em; text-transform: uppercase;\n  border: 1px solid var(--ink); padding: 5px 10px; border-radius: 100px;\n  color: var(--ink);\n}\n\n/* SVG drawing defaults */\n.dwg { font-family: 'IBM Plex Mono', monospace; }\n.dwg .ln { fill: none; stroke: var(--ink); stroke-width: 1; }\n.dwg .ln-heavy { fill: none; stroke: var(--ink); stroke-width: 2; }\n.dwg .ln-light { fill: none; stroke: var(--ink-3); stroke-width: 0.5; }\n.dwg .ln-dim { fill: none; stroke: var(--ink-3); stroke-width: 0.5; }\n.dwg .ln-dashed { fill: none; stroke: var(--c-warn); stroke-width: 1; stroke-dasharray: 6 4; }\n.dwg .ln-centerline { fill: none; stroke: var(--ink-3); stroke-width: 0.5; stroke-dasharray: 8 3 1 3; }\n.dwg .dim { font-size: 11px; fill: var(--ink-3); font-family: 'IBM Plex Mono', monospace; }\n.dwg .lbl { font-size: 12px; fill: var(--ink); font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }\n.dwg .lbl-sm { font-size: 9px; fill: var(--ink-2); font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.04em; text-transform: uppercase; }\n.dwg .num { font-size: 10px; fill: var(--ink); font-family: 'IBM Plex Mono', monospace; }\n\n/* Grid background for site plan */\n.grid-bg {\n  background-image:\n    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);\n  background-size: 40px 40px;\n}\n\n/* Page number / nav indicator */\n.pg {\n  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);\n  font-family: 'IBM Plex Mono', monospace; font-size: 12px;\n  letter-spacing: 0.18em; color: var(--ink-3); text-transform: uppercase;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;background:var(--paper-2);color:var(--ink);font-family:'DM Sans',sans-serif;}\n  .doc{max-width:1180px;margin:0 auto;background:var(--paper);min-height:100vh;\n       border-left:1px solid var(--rule-light);border-right:1px solid var(--rule-light);}\n  .pad{padding:0 72px;}\n  /* top bar */\n  .topbar{display:flex;justify-content:space-between;align-items:flex-start;\n          padding:28px 72px;border-bottom:1px solid var(--ink);}\n  .topbar .l{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;\n             text-transform:uppercase;color:var(--ink-4);}\n  .topbar .v{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.08em;\n             text-transform:uppercase;color:var(--ink);font-weight:600;margin-top:3px;}\n  .topbar .r{text-align:right;}\n  /* hero */\n  .hero{padding:64px 72px 52px;border-bottom:1px solid var(--ink);}\n  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.18em;\n           text-transform:uppercase;color:var(--ink-3);margin-bottom:24px;}\n  h1.title{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-.02em;\n           line-height:.98;font-size:76px;margin:0;max-width:14ch;}\n  .lede{font-size:21px;line-height:1.5;color:var(--ink-2);max-width:60ch;margin:28px 0 0;}\n  .sec-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;\n             text-transform:uppercase;color:var(--ink-3);padding:48px 72px 0;}\n  /* stream grid */\n  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule-light);\n        margin:20px 72px 0;border:1px solid var(--rule-light);}\n  .card{background:var(--paper);padding:28px 30px;display:flex;flex-direction:column;gap:0;}\n  .card .num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--c-accent);\n             font-weight:600;letter-spacing:.06em;}\n  .card h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:25px;margin:8px 0 2px;\n           letter-spacing:-.01em;}\n  .card .price{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--ink);margin-bottom:12px;}\n  .card .desc{font-size:14.5px;line-height:1.5;color:var(--ink-2);flex:1;}\n  .card .est{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;\n             padding-top:14px;border-top:1px solid var(--rule-light);}\n  .card .est .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;\n                text-transform:uppercase;color:var(--ink-4);}\n  .card .est .vv{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;}\n  /* model table */\n  table.model{width:calc(100% - 144px);margin:22px 72px 0;border-collapse:collapse;font-size:15px;}\n  table.model th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;\n                 text-transform:uppercase;color:var(--ink-3);text-align:left;padding:12px 0;\n                 border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:600;}\n  table.model th.r,table.model td.r{text-align:right;}\n  table.model td{padding:13px 0;border-bottom:1px solid var(--rule-light);color:var(--ink-2);}\n  table.model td.stream{color:var(--ink);font-weight:500;}\n  table.model td.mono,table.model th.mono{font-family:'IBM Plex Mono',monospace;}\n  table.model tr.total td{border-top:1px solid var(--ink);border-bottom:none;padding-top:18px;\n        font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;color:var(--ink);}\n  /* mix bar */\n  .mixwrap{margin:34px 72px 0;}\n  .mix{display:flex;height:54px;border:1px solid var(--ink);overflow:hidden;}\n  .mix div{display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;\n           font-size:10px;letter-spacing:.04em;color:#fff;border-right:1px solid rgba(255,255,255,.25);}\n  .mix div:last-child{border-right:none;}\n  /* notes */\n  .notes{margin:48px 0 0;border-top:1px solid var(--ink);padding:26px 72px 64px;}\n  .notes ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink-3);}\n  .notes li{margin-bottom:8px;}\n  .foot{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:10px;\n        letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);\n        border-top:1px solid var(--rule-light);padding:16px 72px;}\n  @media(max-width:760px){.grid{grid-template-columns:1fr;}h1.title{font-size:52px;}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"doc\">\n\n  <div class=\"topbar\">\n    <div><div class=\"l\">Project<\u002Fdiv><div class=\"v\">Maine Padel Academy<\u002Fdiv><\u002Fdiv>\n    <div class=\"r\"><div class=\"l\">Document<\u002Fdiv><div class=\"v\">Business Model · BM-001<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"hero\">\n    <div class=\"eyebrow\">Business model &nbsp;·&nbsp; revenue streams<\u002Fdiv>\n    <h1 class=\"title\">Eight ways the academy earns.<\u002Fh1>\n    <p class=\"lede\">A padel academy is a stack of revenue lines on one set of courts — daily play, recurring membership, coaching, camps, lodging, food &amp; beverage, retail, and events. Below is the model, with the assumptions behind each line. Figures are concept‑level, stabilized‑year estimates to be firmed up in a full pro‑forma.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"sec-label\">The eight streams<\u002Fdiv>\n  <div class=\"grid\">\n\n    <div class=\"card\">\n      <div class=\"num\">01<\u002Fdiv>\n      <h3>Court sessions<\u002Fh3>\n      <div class=\"price\">90‑min open play · <strong>$25 / person<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">Drop‑in and online‑booked 90‑minute sessions across 3 covered courts + the outdoor show court. Four players a court = $100 a session; off‑peak and member rates flex around it.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$860k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">02<\u002Fdiv>\n      <h3>Memberships<\u002Fh3>\n      <div class=\"price\">Tiered · <strong>Social / Player / Academy<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">Monthly dues with included court credits, priority booking, and member pricing on lessons &amp; the restaurant. Recurring revenue that smooths the off‑season.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$360k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">03<\u002Fdiv>\n      <h3>Lessons &amp; clinics<\u002Fh3>\n      <div class=\"price\">Private <strong>$80/hr<\u002Fstrong> · group clinics <strong>$30<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">Certified coaches running privates, semi‑privates and group clinics — the engine of an “academy” brand and the top of the funnel into memberships and camps.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$220k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">04<\u002Fdiv>\n      <h3>Multi‑day camps<\u002Fh3>\n      <div class=\"price\">Weekend &amp; week‑long · <strong>~$600 / player<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">Intensive academy camps and clinics that pull players from across the region and country — court time, coaching, video and meals bundled. Pairs directly with lodging.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$190k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">05<\u002Fdiv>\n      <h3>Play &amp; stay<\u002Fh3>\n      <div class=\"price\">16 rooms · <strong>~$180 / night<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">Short‑stay lodging on floors 2–3 — camp and clinic packages plus public “learn‑and‑stay” reservations. Turns a day trip into a two‑night booking.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$450k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">06<\u002Fdiv>\n      <h3>Restaurant &amp; bar<\u002Fh3>\n      <div class=\"price\">Court‑side dining · <strong>~65 seats<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">A second‑floor restaurant overlooking the courts — open to members, players and the public. Captures spend before, during and after play, and anchors events.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$700k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">07<\u002Fdiv>\n      <h3>Pro shop<\u002Fh3>\n      <div class=\"price\">Retail · demo · <strong>stringing<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">Rackets, strings, footwear and apparel, plus demo/rental and on‑site stringing — a high‑margin convenience for a captive, gear‑hungry audience.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$180k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"card\">\n      <div class=\"num\">08<\u002Fdiv>\n      <h3>Events &amp; tournaments<\u002Fh3>\n      <div class=\"price\">Corporate · leagues · <strong>show‑court<\u002Fstrong><\u002Fdiv>\n      <div class=\"desc\">League nights, corporate &amp; team‑building days, and sponsored finals on the U‑seating show court — facility‑rental and sponsorship revenue plus a marketing flywheel.<\u002Fdiv>\n      <div class=\"est\"><span class=\"k\">Stabilized / yr<\u002Fspan><span class=\"vv\">~$150k<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"sec-label\">Stabilized revenue model &nbsp;·&nbsp; illustrative<\u002Fdiv>\n  <table class=\"model\">\n    <thead>\n      <tr><th>Revenue stream<\u002Fth><th>Key assumption<\u002Fth><th class=\"r mono\">Annual<\u002Fth><\u002Ftr>\n    <\u002Fthead>\n    <tbody>\n      <tr><td class=\"stream\">Court sessions<\u002Ftd><td>4 courts · ~6 paid 90‑min sessions/court/day · $100/session<\u002Ftd><td class=\"r mono\">$860,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Memberships<\u002Ftd><td>~300 members · blended ~$100/mo dues<\u002Ftd><td class=\"r mono\">$360,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Lessons &amp; clinics<\u002Ftd><td>~60 paid coaching hrs/wk · blended rate<\u002Ftd><td class=\"r mono\">$220,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Multi‑day camps<\u002Ftd><td>~20 camps/yr · 16 players · ~$600<\u002Ftd><td class=\"r mono\">$190,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Play &amp; stay<\u002Ftd><td>16 rooms · ~50% occupancy · ~$180/night<\u002Ftd><td class=\"r mono\">$450,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Restaurant &amp; bar<\u002Ftd><td>~65 seats · mature F&amp;B operations<\u002Ftd><td class=\"r mono\">$700,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Pro shop<\u002Ftd><td>Retail + demo/rental + stringing<\u002Ftd><td class=\"r mono\">$180,000<\u002Ftd><\u002Ftr>\n      <tr><td class=\"stream\">Events &amp; tournaments<\u002Ftd><td>Corporate days, leagues, sponsored finals<\u002Ftd><td class=\"r mono\">$150,000<\u002Ftd><\u002Ftr>\n      <tr class=\"total\"><td>Stabilized annual revenue<\u002Ftd><td><\u002Ftd><td class=\"r\">~$3.1M<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n\n  <div class=\"mixwrap\">\n    <div class=\"sec-label\" style=\"padding:0 0 14px;\">Revenue mix<\u002Fdiv>\n    <div class=\"mix\">\n      <div style=\"flex:860;background:var(--c-court);\">COURTS 28%<\u002Fdiv>\n      <div style=\"flex:700;background:var(--c-balcony);\">F&amp;B 23%<\u002Fdiv>\n      <div style=\"flex:450;background:var(--c-bioswale);\">STAY 14%<\u002Fdiv>\n      <div style=\"flex:360;background:var(--c-landscape);\">MEMBER 12%<\u002Fdiv>\n      <div style=\"flex:220;background:var(--c-canopy);\">LESSONS 7%<\u002Fdiv>\n      <div style=\"flex:190;background:#8C7A52;\">CAMPS 6%<\u002Fdiv>\n      <div style=\"flex:180;background:#A06A3A;\">SHOP 6%<\u002Fdiv>\n      <div style=\"flex:150;background:var(--c-accent);\">EVENTS 5%<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"notes\">\n    <div class=\"sec-label\" style=\"padding:0 0 12px;\">Notes &amp; assumptions<\u002Fdiv>\n    <ol>\n      <li>All figures are <strong>concept‑level, stabilized‑year<\u002Fstrong> estimates (roughly year 2–3 at target utilization), not Year‑1 projections. A ramp of 12–24 months should be assumed.<\u002Fli>\n      <li>Court‑session revenue assumes blended drop‑in and rental pricing around the $25/person rate; member play draws on included credits rather than billing per session.<\u002Fli>\n      <li>Restaurant and lodging figures are gross revenue, not contribution — both carry materially higher cost of sales than court &amp; coaching lines; model net margins separately.<\u002Fli>\n      <li>Lodging is positioned as <strong>academy short‑stay<\u002Fstrong> (camps, clinics, learn‑and‑stay), not a conventional hotel; occupancy will track the camp/event calendar.<\u002Fli>\n      <li>Next step is a full pro‑forma: per‑stream cost of sales, staffing, seasonality, debt service and break‑even — which also drives the equity ask.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n\n  <div class=\"foot\">\n    <span>Maine Padel Academy — Technology Park Dr, Portland ME<\u002Fspan>\n    <span>BM-001 · Business Model · Concept<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
